name: homaexpress_courier_admin
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  sizer: ^3.0.5
  http: ^1.1.0
  shared_preferences: ^2.5.3
  fl_chart: ^0.65.0
  progress_state_button: ^1.0.0
  flutter_spinkit: ^5.2.1
  intl: ^0.20.2
  shamsi_date: ^1.1.1
  image_picker: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1   # 👈 اینجا فقط یک‌بار

# 👇 تنظیمات آیکن لانچر – فقط یک بلاک
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/main-logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/main-logo.png"
    background_color: "#FFFFFF"
    theme_color: "#85338A"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/
    - assets/images/

  fonts:
    - family: YekanBakh
      fonts:
        - asset: assets/fonts/YekanBakhRegular.ttf
